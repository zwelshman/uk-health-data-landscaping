response_summary: "Analysis of the 'Making secondary care medicines data research-ready' HDRS project and how BHF DSC services can support its success. The project aims to develop standards and tooling to make hospital prescribing and high-cost drugs data research-ready, led by NHS England SDE with PRSB, University of Liverpool, Understanding Patient Data, and King's College Hospital NHS Foundation Trust. BHF DSC services can provide data curation/engineering, computable phenotypes/codelists, curated assets, PPIE support, and population data access across UK SDEs."
